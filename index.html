<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Planner &amp; Tracker</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2024;--muted:#7a6a70;--line:#ece3da;--accent:#8c1c3a;--accent2:#b8862b;
--ok:#2e7d32;--okbg:#e6f4e8;--pend:#a35c00;--pendbg:#fff1dc;--bad:#b3261e;--badbg:#fde8e6;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header.top{background:linear-gradient(135deg,#6e1229,#a8324f 60%,#b8862b);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0;font-size:26px;letter-spacing:.3px}
.sub{opacity:.88;font-size:13px}
.countdown{margin-left:auto;text-align:right}
.countdown b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
.top .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
nav{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto;align-items:center}
nav button.tabb{border:0;background:none;padding:14px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.tabb:hover{color:var(--ink)}
nav button.tabb.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.ind{font-size:12px;color:var(--muted);white-space:nowrap;padding-left:12px}
#saveInd{margin-left:auto}
#syncInd{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-left:8px;background:#fff}
#syncInd.err{color:var(--bad);border-color:#f0c4c0;background:var(--badbg)}
#syncInd.ok{color:var(--ok);border-color:#b7dcbe}
#bakBar{display:none;background:#fff4dd;border-bottom:1px solid #f1dfbf;padding:8px 20px;font-size:13px;align-items:center;gap:10px;flex-wrap:wrap}
#bakBar.show{display:flex}
main{max-width:1320px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(60,30,30,.04)}
h2{font-family:Georgia,serif;font-weight:400;font-size:21px;margin:0 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:600}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.stat{margin:0}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .val{font-size:22px;font-weight:650;margin-top:4px}
.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}
.stat.okc{border-top:4px solid var(--ok)} .stat.pendc{border-top:4px solid #e09a2b} .stat.acc{border-top:4px solid var(--accent)} .stat.gold{border-top:4px solid var(--accent2)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tfoot td{font-weight:650;border-bottom:0;padding-top:10px}
.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #efd2da;border-color:var(--accent)}
input[type=checkbox]{width:auto}
td input,td select{border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:#ddd0c4;background:#fff}
td input:focus{background:#fff}
input[type=number]{text-align:right}
tr.ok{background:var(--okbg)} tr.pend{background:var(--pendbg)} tr.bad{background:#f4f1f1;color:#8a8a8a}
tr.ok>td:first-child{box-shadow:inset 4px 0 0 var(--ok)} tr.pend>td:first-child{box-shadow:inset 4px 0 0 #e09a2b} tr.bad>td:first-child{box-shadow:inset 4px 0 0 #bbb}
tr.ok .tdone input.ttl{text-decoration:line-through;text-decoration-color:rgba(46,125,50,.5)}
select.s-ok{background:#cdeacf!important;color:var(--ok);font-weight:650;border-color:#b2d9b8!important}
select.s-pend{background:#ffe0b0!important;color:var(--pend);font-weight:650;border-color:#f1c886!important}
select.s-bad{background:#eee!important;color:#777;font-weight:600}
select.s-na{color:#999}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.pill.ok{background:#cdeacf;color:var(--ok)} .pill.pend{background:#ffe0b0;color:var(--pend)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.na{background:#eee;color:#777}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap;width:auto;text-decoration:none;display:inline-block}
.btn:hover{border-color:#cdb9a8}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.pri:hover{background:#74142f}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#f5ede6}
.btn.danger{color:var(--bad)}
.drop{border:2px dashed #d9c3b0;border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:#fffcf8;transition:.15s;display:flex;align-items:center;justify-content:center;gap:12px;min-height:110px}
.drop.over,.mini-drop.over{border-color:var(--accent);background:#fbeef1;color:var(--accent)}
.drop.has{border-style:solid;border-color:#9fd0a6;background:var(--okbg);color:var(--ok)}
.drop img{max-height:90px;max-width:120px;border-radius:6px;border:1px solid var(--line)}
.drop .big{font-size:28px}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#fff}
.mini-drop{width:44px;height:44px;border:1.5px dashed #d9c3b0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#c4a993;cursor:pointer;background:#fff}
.mini-drop.file{border-style:solid;border-color:var(--line);font-size:22px;cursor:zoom-in}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.exform{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:800px){.exform{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.ck{display:flex;gap:8px;align-items:center;cursor:pointer}
.bar{height:8px;background:#f0e7df;border-radius:99px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent2);border-radius:99px}
.bar>i.ok{background:var(--ok)} .bar>i.over{background:var(--bad)}
.event{border-left:6px solid #e09a2b;padding-top:12px}
.event.done{border-left-color:var(--ok)}
.event.empty-ev{border-left-color:#d9cfc6}
.ehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ehead .ename{font-family:Georgia,serif;font-size:21px;border:1px solid transparent;padding:2px 6px;width:190px;background:transparent}
.ehead .ename:hover{border-color:var(--line)}
.ehead input[type=date]{width:150px} .ehead .venue{width:200px}
.ehead .prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:170px}
.spacer{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar>input,.toolbar>select{width:auto}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;background:#fff;margin:1px;color:var(--muted);font:inherit;font-size:11px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#f6eee6;border-radius:999px;padding:4px 6px 4px 12px;margin:3px}
.pchip button{border:0;background:#e8d9cc;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.empty{padding:22px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.overdue{color:var(--bad)!important;font-weight:650}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.hc{display:flex;gap:8px;flex-wrap:wrap}
.hc .box{background:#fbf6f1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.hc .box b{font-size:18px;display:block}
.list-up li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list-up{list-style:none;margin:0;padding:0}
.note{background:#fff8ec;border:1px solid #f1dfbf;border-radius:10px;padding:10px 14px;font-size:13px}
.note.ok{background:var(--okbg);border-color:#b7dcbe}
.note.err{background:var(--badbg);border-color:#f0c4c0}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:13px} ol.steps li{margin:4px 0}
code{background:#f3ebe4;border-radius:4px;padding:1px 5px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(30,10,15,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:95vw;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.modal .body{overflow:auto;padding:10px;display:flex;justify-content:center;background:#f4f0ec}
.modal img{max-width:90vw;max-height:80vh}
.modal iframe{width:85vw;height:80vh;border:0;background:#fff}
.pdfopts{padding:16px 20px;overflow:auto;width:min(640px,92vw);display:block}
.pdfopts .opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pdfopts .opt .sub2{margin:8px 0 0 26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.pdfopts .opt .sub2 select{width:auto}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#6e1229,#a8324f 60%,#b8862b);display:none;align-items:center;justify-content:center;padding:20px}
#lock.show{display:flex}
#lock .lk{background:#fff;border-radius:16px;padding:28px 30px;width:min(400px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
#lock .lk h2{margin:6px 0 4px} #lock .lk p{color:var(--muted);font-size:13px;margin:0 0 16px}
#lock input[type=password]{font-size:18px;text-align:center;letter-spacing:3px;padding:10px}
#lock .lerr{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0}
#lockBtn{margin-left:6px}
/* ---- printable report ---- */
#report{display:none}
@media print{
  @page{margin:12mm}
  body.rep{background:#fff}
  body.rep>*:not(#report){display:none!important}
  body.rep #report{display:block}
  body:not(.rep) nav, body:not(.rep) .noprint, body:not(.rep) .btn, body:not(.rep) #bakBar{display:none!important}
  body:not(.rep) td input, body:not(.rep) td select{border:0!important;appearance:none;-webkit-appearance:none}
}
#report{font:11px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
#report *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#report .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #8c1c3a;padding-bottom:6px;margin-bottom:10px}
#report .rt{font-family:Georgia,serif;font-size:22px;color:#8c1c3a}
#report .rs{color:#666;font-size:11px}
#report .sec{break-before:page} #report .sec.first{break-before:auto}
#report h2{font-family:Georgia,serif;font-size:17px;margin:4px 0 8px;color:#8c1c3a;font-weight:400}
#report h3{font-size:13px;margin:14px 0 4px;text-transform:none;letter-spacing:0;color:#222;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#report h3 small{font-weight:400;color:#666;font-size:11px}
#report table{border-collapse:collapse;width:100%;margin-bottom:8px}
#report thead{display:table-header-group}
#report th{background:#f3ebe4;color:#444;font-size:9.5px;border:1px solid #ddd;padding:4px 5px;text-transform:uppercase;letter-spacing:.3px}
#report td{border:1px solid #ddd;padding:4px 5px;font-size:10.5px;vertical-align:top}
#report tr{break-inside:avoid}
#report tr.ok td{background:#e6f4e8} #report tr.pend td{background:#fff4e3} #report tr.bad td{background:#f2f2f2;color:#888}
#report tfoot td{font-weight:700;background:#faf6f1}
#report .tag{font-weight:700;font-size:9.5px;padding:1px 6px;border-radius:8px;white-space:nowrap}
#report .tag.ok{background:#cdeacf;color:#2e7d32} #report .tag.pend{background:#ffe0b0;color:#a35c00} #report .tag.na{color:#999}
#report .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
#report .kpis div{border:1px solid #e3d8ce;border-radius:6px;padding:6px 8px}
#report .kpis b{display:block;font-size:15px}
#report .kpis span{font-size:9.5px;color:#666;text-transform:uppercase;letter-spacing:.4px}
#report .rcpt{break-before:page;text-align:center}
#report .rcpt img{max-width:100%;max-height:235mm;border:1px solid #ddd}
#report .rcpt p{margin:0 0 8px;font-size:12px}
#report .box{font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="hdrNames">Our Wedding</h1>
    <div class="sub" id="hdrSub">Planner &amp; expense tracker</div>
  </div>
  <div class="countdown" id="hdrCount"></div>
  <button class="btn sm noprint" data-act="pdf" data-preset="summary">📄 PDF / Print</button>
</header>
<nav id="nav">
  <button class="tabb" data-act="tab" data-tab="dashboard">Dashboard</button>
  <button class="tabb" data-act="tab" data-tab="expenses">Expenses &amp; Receipts</button>
  <button class="tabb" data-act="tab" data-tab="checklist">Event Checklist</button>
  <button class="tabb" data-act="tab" data-tab="vendors">Vendors</button>
  <button class="tabb" data-act="tab" data-tab="guests">Guests &amp; RSVP</button>
  <button class="tabb" data-act="tab" data-tab="settings">Settings, Sharing &amp; Backup</button>
  <span id="saveInd" class="ind"></span>
  <span id="syncInd" class="ind" data-act="syncNow" style="display:none"></span>
  <button id="lockBtn" class="btn sm ghost" data-act="lockNow" title="Lock the planner" style="display:none">🔒 Lock</button>
</nav>
<div id="bakBar"></div>
<main id="view"><div class="empty">Loading…</div></main>
<datalist id="peopleList"></datalist>

<div class="modal-bg" id="modal">
  <div class="modal">
    <header><b id="mTitle"></b><span class="spacer"></span><a class="btn sm" id="mDl" download>Download</a><button class="btn sm" data-act="closeModal">Close ✕</button></header>
    <div class="body" id="mBody"></div>
  </div>
</div>
<div class="modal-bg" id="pdfModal">
  <div class="modal">
    <header><b>Create PDF / Print</b><span class="spacer"></span><button class="btn sm" data-act="closePdf">Close ✕</button></header>
    <div class="pdfopts" id="pdfBody"></div>
  </div>
</div>
<div id="report"></div>
<div id="lock"><div class="lk">
  <div style="font-size:34px">🔒</div>
  <h2 id="lockTitle">Wedding Planner</h2>
  <p id="lockMsg">Enter the family passcode to open the planner.</p>
  <input type="password" id="lockCode" placeholder="Passcode" autocomplete="current-password">
  <label class="ck small" style="justify-content:center;margin-top:10px;color:var(--muted)"><input type="checkbox" id="lockRem"> Remember on this device</label>
  <div class="lerr" id="lockErr"></div>
  <button class="btn pri" id="lockGo" style="width:100%;padding:10px">Unlock</button>
  <div style="margin-top:14px"><a href="#" class="small" id="lockForgot">Forgot passcode?</a></div>
</div></div>

<script>
/* ================= constants ================= */
const DEFAULT_EVENTS=['Mehndi','Maiyan','Churra','Batna','Jago','Wedding','Reception'];
const DEFAULT_CATS=['Venue','Catering & Sweets','Décor & Flowers','Attire & Jewelry','Photography & Video','DJ / Dhol / Entertainment','Makeup, Hair & Mehndi Artist','Invitations & Stationery','Gifts, Shagun & Favors','Transportation','Accommodation','Ceremony Items','Miscellaneous'];
const METHODS=['','Cash','Check','Zelle','Credit Card','Other'];
const SUGGESTED={
 Mehndi:['Book mehndi artist','Finalize bride\'s mehndi design','Order mehndi cones for guests','Seating, cushions & décor','Dhol / music & giddha','Snacks, chai & drinks','Outfits for mehndi'],
 Maiyan:['Prepare maiyan paste ingredients','Arrange chowki & phulkari / cloth','Old clothes for bride/groom to wear','Invite close family & neighbours','Sweets for distribution'],
 Churra:['Order churra set','Confirm mama (maternal uncle) & family','Kaleere','Photographer for churra ceremony','Gifts for mama & family'],
 Batna:['Prepare batna paste','Arrange bathing area & towels','Coordinate family members for ritual','Breakfast / snacks for family'],
 Jago:['Decorate jago gaagar with diyas','Oil, candles & matches','Plan route & notify neighbours','Book dhol player','Boliyan / song list','Late-night food'],
 Wedding:['Confirm ceremony venue & timing','Confirm officiant / ceremony arrangements','Milni garlands & gifts','Baraat arrangements (car/horse, dhol)','Photographer & videographer','Finalize catering menu','Wedding attire & jewelry','Doli / vidaai arrangements'],
 Reception:['Book reception hall','DJ & playlist','Seating chart','Cake & desserts','Stage & décor','MC / speeches','Guest favors','Transportation & parking']
};
const GENERIC_SUGG=['Book venue','Arrange food','Décor','Music','Photographer','Invite guests','Outfits'];
const WEEK=7*864e5;

/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const sum=(arr,f)=>arr.reduce((a,x)=>a+num(typeof f==='function'?f(x):x[f]),0);
function todayISO(){const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)}
function fmt(n){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:S.settings.currency||'USD'}).format(n||0)}catch(e){return '$'+(n||0).toFixed(2)}}
function fmtDate(d){if(!d)return '—';const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtTime(ms){return new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function daysUntil(d){if(!d)return null;const a=new Date(d+'T00:00'),b=new Date(todayISO()+'T00:00');return Math.round((a-b)/864e5)}
function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0}
function evName(id){const e=S.events.find(x=>x.id===id);return e?e.name:''}
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
const LS={get(k,d){try{const v=localStorage.getItem('wp-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('wp-'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('wp-'+k)}catch(e){}}};
function b64encBytes(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const b64enc=str=>b64encBytes(new TextEncoder().encode(str));
function b64dec(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}

function b64bytes(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}

/* ================= passcode & encryption (AES-256-GCM, PBKDF2) ================= */
const PC={code:null,salt:null,keys:{}};
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
function loadCode(){let c=null;try{c=sessionStorage.getItem('wp-pc')}catch(e){}PC.code=c||LS.get('pcode',null);PC.salt=LS.get('pcsalt',null)}
function storeCode(code,remember){try{code?sessionStorage.setItem('wp-pc',code):sessionStorage.removeItem('wp-pc')}catch(e){}
 if(code&&remember)LS.set('pcode',code);else LS.del('pcode')}
const newSalt=()=>b64encBytes(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(code,salt){const k=code+'|'+salt;if(PC.keys[k])return PC.keys[k];
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 return PC.keys[k]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBytes(key,u8){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function decBytes(key,u8){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},key,u8.slice(12)))}
async function makeCheck(code){const salt=newSalt(),k=await deriveKey(code,salt);LS.set('pclock',{salt,data:b64encBytes(await encBytes(k,new TextEncoder().encode('wedding-ok')))})}
async function verifyLocal(code){const c=LS.get('pclock',null);if(!c)return true;try{const k=await deriveKey(code,c.salt);return new TextDecoder().decode(await decBytes(k,b64bytes(c.data)))==='wedding-ok'}catch(e){return false}}
async function encryptShared(text){const k=await deriveKey(PC.code,PC.salt);
 return JSON.stringify({enc:1,salt:PC.salt,note:'Encrypted wedding planner data. Open the planner page and enter the family passcode to read it.',data:b64encBytes(await encBytes(k,new TextEncoder().encode(text)))})}
async function decryptShared(obj){
 const tries=[PC.code,(LS.get('pcpending',null)||{}).old].filter(Boolean);
 for(const c of tries){try{const k=await deriveKey(c,obj.salt);return new TextDecoder().decode(await decBytes(k,b64bytes(obj.data)))}catch(e){}}
 const err=new Error(PC.code?'The family passcode has been changed. Enter the new passcode.':'This shared planner is protected. Enter the family passcode.');err.needPass=true;throw err}
let lockMode=null,started=false,pendingJoin=null;
function showLock(mode,msg){lockMode=mode;$('#lock').classList.add('show');$('#lockMsg').textContent=msg||'Enter the family passcode to open the planner.';
 $('#lockTitle').textContent=(S&&S.settings.names)||'Wedding Planner';$('#lockErr').textContent='';$('#lockCode').value='';$('#lockRem').checked=!!LS.get('pcode',null);setTimeout(()=>$('#lockCode').focus(),50)}
async function tryUnlock(){
 const code=$('#lockCode').value;if(!code)return;const btn=$('#lockGo');btn.disabled=true;btn.textContent='Checking…';$('#lockErr').textContent='';
 try{
  if(lockMode==='join'){const j=pendingJoin;let tok;
   try{tok=new TextDecoder().decode(await decBytes(await deriveKey(code,j.salt),b64bytes(j.tok)))}catch(e){$('#lockErr').textContent='That passcode is not right.';return}
   ['owner','repo','branch','path','rdir'].forEach(k=>{if(j[k]!=null)GH[k]=String(j[k])});GH.token=tok;LS.set('gh',GH);
   const prev=PC.code;PC.code=code;
   try{await pull()}catch(e){PC.code=prev;$('#lockErr').textContent=e.needPass?'Passcode opened the invite, but the shared data uses a different passcode now. Ask for a new invite link.':e.message;return}
   await makeCheck(code);pendingJoin=null;repoOk=false}
  else if(lockMode==='local'){if(!(await verifyLocal(code))){$('#lockErr').textContent='That passcode is not right.';return}}
  else{const prev=PC.code;PC.code=code;try{await pull()}catch(e){PC.code=prev;$('#lockErr').textContent=e.needPass?'That passcode is not right.':e.message;return}await makeCheck(code)}
  PC.code=code;storeCode(code,$('#lockRem').checked);$('#lock').classList.remove('show');const m=lockMode;lockMode=null;
  if(!started)start();else{render();if(m==='sync'||m==='join')sync()}
 }finally{btn.disabled=false;btn.textContent='Unlock'}}
$('#lockGo').addEventListener('click',tryUnlock);
$('#lockCode').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});
$('#lockForgot').addEventListener('click',e=>{e.preventDefault();
 if(lockMode==='sync'||ghReady()){if(confirm('Ask whoever set up the planner for the current family passcode.\n\nIf you want to start over on this device instead, click OK to erase this device\'s copy (the shared copy on GitHub is not touched).')){resetDevice();$('#lock').classList.remove('show');lockMode=null;if(!started)start();else render()}}
 else if(confirm('The passcode can\'t be recovered. Click OK to erase this device\'s copy of the planner and start fresh (download a backup next time!).')){resetDevice();$('#lock').classList.remove('show');lockMode=null;if(!started)start();else render()}});

function fresh(){return{v:2,pristine:true,settings:{names:'',date:'',budget:0,currency:'USD',u:0},people:[],deleted:{},
 categories:DEFAULT_CATS.map((n,i)=>({id:'cat-'+slug(n),name:n,budget:0,c:i,u:0})),
 events:DEFAULT_EVENTS.map((n,i)=>({id:'ev-'+slug(n),name:n,date:'',venue:'',ord:i,c:i,u:0,tasks:[]})),

function normalize(s){
 const f=fresh();if(!s||typeof s!=='object')return f;
 const arr=(k)=>Array.isArray(s[k])?s[k]:f[k];
 const withC=(list)=>list.map((x,i)=>({...x,c:x.c??i}));
 const o={...f,...s};
 o.settings={...f.settings,...(s.settings||{})};
 o.deleted={...(s.deleted||{})};
 o.people=withC((Array.isArray(s.people)?s.people:[]).map(p=>typeof p==='string'?{id:'p-'+slug(p),name:p,u:1}:p));
 o.categories=withC(arr('categories').map(c=>({id:'cat-'+slug(c.name||'x'),...c})));
 o.events=withC(arr('events')).map((e,i)=>{const ev={id:uid(),name:'Event',date:'',venue:'',...e,ord:e.ord??i,tasks:withC(Array.isArray(e.tasks)?e.tasks:[])};
   if('collapsed' in ev){if(ev.collapsed)COL.add(ev.id);delete ev.collapsed}return ev}).sort((a,b)=>a.ord-b.ord);
 o.expenses=withC(arr('expenses')).map(e=>{if(e.receipt&&e.receipt.data){const rv=e.receipt.rv||uid();RC[e.id]={rv,data:e.receipt.data};migratedRC.push(e.id);const{data,...m}=e.receipt;return{...e,receipt:{...m,rv}}}return e});
 o.vendors=withC(arr('vendors'));o.guests=withC(arr('guests'));
 if(s.pristine===undefined)o.pristine=false;
 return o}

/* ================= local storage (IndexedDB) ================= */
const DB={db:null,
 open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej('no idb');const r=indexedDB.open('wedding-planner',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
 del(k){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
 prefix(p){return new Promise((res,rej)=>{const out={};const q=this.db.transaction('kv').objectStore('kv').openCursor(IDBKeyRange.bound(p,p+'￿'));
  q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};q.onerror=()=>rej(q.error)})}};
async function load(){
 try{await DB.open();storageMode='idb';const s=await DB.get('state');const rc=await DB.prefix('rc:');for(const k in rc)RC[k.slice(3)]=rc[k];return s||null}
 catch(e){try{const s=localStorage.getItem('wedding-planner');storageMode='local';
   for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('wp-rc:'))RC[k.slice(6)]=JSON.parse(localStorage.getItem(k))}
   return s?JSON.parse(s):null}catch(e2){storageMode='memory';return null}}}

/* ================= merge (record-level, last edit wins) ================= */
const byC=(a,b)=>((a.c??0)-(b.c??0))||String(a.id).localeCompare(String(b.id));
function newer(x,p){const xu=x.u||0,pu=p.u||0;return xu>pu||(xu===pu&&canon(x)>canon(p))}
function mergeList(a=[],b=[],del={}){const m=new Map();for(const x of a)m.set(x.id,x);
 for(const x of b){const p=m.get(x.id);if(!p||newer(x,p))m.set(x.id,x)}
 return [...m.values()].filter(x=>!(del[x.id]!=null&&del[x.id]>=(x.u||0))).sort(byC)}
function mergeState(L,R){
 if(!R)return L;
 const del={...(R.deleted||{})};for(const[k,v]of Object.entries(L.deleted||{}))del[k]=Math.max(del[k]||0,v);
 const out={...L,deleted:del,v:2};
 out.settings=newer(R.settings||{},L.settings||{})?R.settings:L.settings;
 for(const k of ['categories','expenses','vendors','guests','people'])out[k]=mergeList(L[k],R[k],del);
 const strip=e=>{const{tasks,...r}=e;return r};
 const evs=mergeList(L.events.map(strip),(R.events||[]).map(strip),del);
 out.events=evs.map(e=>{const le=L.events.find(x=>x.id===e.id),re=(R.events||[]).find(x=>x.id===e.id);
  return{...e,tasks:mergeList(le?le.tasks:[],re?re.tasks:[],del)}}).sort((a,b)=>((a.ord??0)-(b.ord??0))||byC(a,b));
 return out}
function sharedText(st){const{pristine,...rest}=st;return canon(rest)}

/* ================= GitHub sync ================= */
let syncTimer=null,syncing=false,syncAgain=false,repoOk=false,lastErr='',lastSync=LS.get('lastSync',0),needRender=false;
const ghReady=()=>!!(GH.owner&&GH.repo&&GH.token);
function setSync(t,cls){const el=$('#syncInd');el.style.display=ghReady()?'':'none';el.textContent=t;el.className='ind '+(cls||'');el.title=lastErr||'Click to sync now'}
function scheduleSync(ms=4000){if(!ghReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),ms)}
function ghUrl(path,isRepo){const base=`https://api.github.com/repos/${encodeURIComponent(GH.owner.trim())}/${encodeURIComponent(GH.repo.trim())}`;
 return isRepo?base:`${base}/contents/${path.split('/').filter(Boolean).map(encodeURIComponent).join('/')}`}
async function gh(method,path,body,accept,isRepo){
 let url=ghUrl(path,isRepo);if(method==='GET'&&!isRepo&&GH.branch)url+=`?ref=${encodeURIComponent(GH.branch.trim())}`;
 return fetch(url,{method,cache:'no-store',headers:{Authorization:`Bearer ${GH.token.trim()}`,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}
async function apiErr(r,what){let m='';try{m=(await r.json()).message||''}catch(e){}
 if(r.status===401)return new Error('GitHub rejected the access token (invalid or expired).');
 if(r.status===403)return new Error('Token is not allowed to do this ('+(m||'forbidden')+'). It needs Contents: Read and write on this repository.');
 if(r.status===404)return new Error(`${what||'Repository'} not found — check owner/repository name, and that the token has access to it.`);
 return new Error(`GitHub error ${r.status}: ${m}`)}
async function checkRepo(){const r=await gh('GET','',null,null,true);if(!r.ok)throw await apiErr(r,'Repository');const j=await r.json();repoOk=true;return j}
async function pull(){
 const r=await gh('GET',GH.path);if(r.status===404)return{sha:null,text:null};if(!r.ok)throw await apiErr(r,'Data file');
 const j=await r.json();let text;
 if(j.content&&j.encoding==='base64')text=b64dec(j.content);
 else{const r2=await gh('GET',GH.path,null,'application/vnd.github.raw+json');if(!r2.ok)throw await apiErr(r2,'Data file');text=await r2.text()}
 let obj;try{obj=JSON.parse(text)}catch(e){throw new Error('The shared data file on GitHub is not valid JSON.')}
 if(obj&&obj.enc){if(!hasCrypto())throw new Error('This browser cannot decrypt the planner (open it from the https:// GitHub Pages link).');
  return{sha:j.sha,text,plain:await decryptShared(obj),enc:true,salt:obj.salt}}
 return{sha:j.sha,text,plain:text,enc:false}}
async function push(text,sha){
 const body={message:`Wedding planner update${GH.name?' by '+GH.name:''}`,content:b64enc(text)};if(sha)body.sha=sha;if(GH.branch)body.branch=GH.branch.trim();
 const r=await gh('PUT',GH.path,body);if(r.status===409||r.status===422)return 'conflict';if(!r.ok)throw await apiErr(r,'Data file');return 'ok'}
function rExt(t){return t==='application/pdf'?'pdf':t==='image/png'?'png':t==='image/gif'?'gif':t==='image/webp'?'webp':'jpg'}
async function uploadReceipts(){
 for(const e of S.expenses){if(!e.receipt||e.receipt.path)continue;const rc=RC[e.id];if(!rc||rc.rv!==e.receipt.rv)continue;
  const enc=!!PC.salt,tagS=enc?PC.salt.replace(/[^a-z0-9]/gi,'').slice(0,6):'';
  const path=`${(GH.rdir||'data/receipts').replace(/\/+$/,'')}/${e.id}-${e.receipt.rv}${enc?'-'+tagS+'.enc':'.'+rExt(e.receipt.type)}`;
  let content=rc.data.split(',')[1];
  if(enc)content=b64encBytes(await encBytes(await deriveKey(PC.code,PC.salt),b64bytes(content)));
  const body={message:`Receipt: ${enc?'(encrypted)':e.receiptName||e.receipt.name}`,content};if(GH.branch)body.branch=GH.branch.trim();
  const r=await gh('PUT',path,body);
  if(!r.ok&&r.status!==422)throw await apiErr(r,'Receipts folder');
  const old=e.receipt.oldPath;delete e.receipt.oldPath;
  e.receipt.path=path;e.receipt.enc=enc;touch(e);
  if(old&&old!==path)deleteFile(old)}}
async function deleteFile(path){try{const r=await gh('GET',path);if(!r.ok)return;const j=await r.json();
 const body={message:'Remove replaced receipt copy',sha:j.sha};if(GH.branch)body.branch=GH.branch.trim();await gh('DELETE',path,body)}catch(e){}}
async function downloadReceipt(e){
 const r=await gh('GET',e.receipt.path,null,'application/vnd.github.raw+json');if(!r.ok)throw await apiErr(r,'Receipt file');
 let buf=new Uint8Array(await r.arrayBuffer());
 if(/\.enc$/.test(e.receipt.path)){if(!PC.code||!PC.salt)throw new Error('Passcode needed');buf=await decBytes(await deriveKey(PC.code,PC.salt),buf)}
 RC[e.id]={rv:e.receipt.rv,data:`data:${e.receipt.type};base64,`+b64encBytes(buf)};await saveRC(e.id)}
async function downloadMissing(){let any=false;
 for(const e of S.expenses){if(e.receipt&&e.receipt.path&&(!RC[e.id]||RC[e.id].rv!==e.receipt.rv)){try{await downloadReceipt(e);any=true}catch(err){}}}
 if(any)safeRender()}
async function sync(){
 if(!ghReady()||lockMode)return;if(syncing){syncAgain=true;return}
 syncing=true;clearTimeout(syncTimer);setSync('⟳ Syncing…');
 try{
  if(!repoOk)await checkRepo();
  let done=false;const pend=LS.get('pcpending',null);
  for(let i=0;i<5&&!done;i++){
   const rem=await pull();
   if(!pend&&rem.text)PC.salt=rem.enc?rem.salt:null;           // follow the shared file's protection setting
   if(PC.salt&&!PC.code){const err=new Error('Enter the family passcode.');err.needPass=true;throw err}
   await uploadReceipts();
   const R=rem.plain?JSON.parse(rem.plain):null;
   let merged;
   if(R&&S.pristine){merged=normalize(R);merged.pristine=false}   // brand-new device: adopt shared data
   else merged=mergeState(S,R?normalize(R):null);
   const text=sharedText(merged);
   const protChanged=rem.text!=null&&((!!PC.salt)!==rem.enc||(PC.salt&&rem.salt!==PC.salt));
   if(text!==rem.plain||protChanged){
    const body=PC.salt?await encryptShared(text):text;
    if(await push(body,rem.sha)==='conflict'){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue}}
   S=S.pristine?merged:mergeState(S,merged);S.pristine=false;   // keep any edits made while syncing
   done=true}
  if(!done)throw new Error('Could not save after several tries — someone else is editing. Will retry.');
  if(pend)LS.del('pcpending');PC.salt?LS.set('pcsalt',PC.salt):LS.del('pcsalt');
  if(PC.salt&&!LS.get('pclock',null)&&PC.code)await makeCheck(PC.code);
  lastErr='';lastSync=Date.now();LS.set('lastSync',lastSync);
  await persistLocal();setSync('☁ Synced '+new Date(lastSync).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),'ok');
  safeRender();downloadMissing();
 }catch(e){lastErr=e.message||String(e);
  if(e.needPass){setSync('🔒 Passcode needed','err');PC.code=null;storeCode(null);syncing=false;showLock('sync',e.message);return}
  setSync('⚠ Sync problem','err');if(tab==='settings')safeRender()}
 finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(800)}}}

 const bar=$('#bakBar');const last=Math.max(LS.get('lastBackup',0),LS.get('firstUse',Date.now()),ghReady()&&!lastErr?lastSync:0);
 const show=hasData()&&Date.now()-last>WEEK&&Date.now()>LS.get('snooze',0);
 bar.classList.toggle('show',!!show);
 if(show){const days=Math.floor((Date.now()-Math.max(LS.get('lastBackup',0),LS.get('firstUse',Date.now())))/864e5);
  bar.innerHTML=`💾 <span>${LS.get('lastBackup',0)?`It's been ${days} days since you downloaded a backup on this device.`:`You haven't downloaded a backup on this device yet.`} Receipts and payment records are hard to recreate — keep a copy.</span><button class="btn sm pri" data-act="backup">Download backup</button><button class="btn sm" data-act="snooze">Remind me tomorrow</button>`}}

/* ---------- Dashboard ---------- */
function stats(){
 const exp=S.expenses,budget=num(S.settings.budget);
 const spent=sum(exp,'cost'),repaid=sum(exp.filter(e=>e.status==='Paid'),'cost');
 const tasks=S.events.flatMap(e=>e.tasks.map(t=>({...t,evId:e.id,evName:e.name})));
 const done=tasks.filter(t=>t.status==='Complete').length;
 const tPend=sum(tasks.filter(t=>t.payStatus==='Pending'),'amount');
 const vBal=S.vendors.reduce((a,v)=>a+(v.status==='Paid'?0:Math.max(0,num(v.total)-num(v.deposit))),0);
 return{budget,spent,repaid,owed:spent-repaid,remaining:budget-spent,tasks,done,tPend,vBal}}
function catRows(){const exp=S.expenses;const cats=S.categories.map(c=>({...c,spent:sum(exp.filter(e=>e.category===c.name),'cost')}));
 const uncat=sum(exp.filter(e=>!S.categories.some(c=>c.name===e.category)),'cost');return{cats,uncat}}
function peopleRows(){const ppl={};S.expenses.forEach(e=>{const p=e.boughtBy||'(not set)';ppl[p]=ppl[p]||{t:0,r:0,n:0};ppl[p].t+=num(e.cost);ppl[p].n++;if(e.status==='Paid')ppl[p].r+=num(e.cost)});
 return Object.entries(ppl).sort((a,b)=>(b[1].t-b[1].r)-(a[1].t-a[1].r))}
function rDash(){
 const st=S.settings,X=stats();
 let h='';
 if(!st.names||!st.date||!X.budget)h+=`<div class="note noprint" style="margin-bottom:16px">👋 <b>Getting started:</b> add the couple's names, wedding date and total budget in <a href="#" data-act="tab" data-tab="settings">Settings</a>, plus family members who'll be buying things or handling tasks. To share with family, set up <b>Shared sync</b> in Settings.</div>`;
 h+=`<div class="grid stats" style="margin-bottom:16px">
  <div class="card stat acc"><div class="lbl">Total budget</div><div class="val">${fmt(X.budget)}</div><div class="hint">${X.budget?pct(X.spent,X.budget)+'% used':'Set in Settings'}</div></div>
  <div class="card stat gold"><div class="lbl">Spent (logged expenses)</div><div class="val">${fmt(X.spent)}</div><div class="hint">${S.expenses.length} receipt${S.expenses.length===1?'':'s'}</div></div>
  <div class="card stat ${X.remaining<0?'pendc':'okc'}"><div class="lbl">Budget remaining</div><div class="val" style="${X.remaining<0?'color:var(--bad)':''}">${fmt(X.remaining)}</div><div class="hint">${X.remaining<0?'Over budget':'Budget − logged expenses'}</div></div>
  <div class="card stat pendc"><div class="lbl">Owed back to buyers</div><div class="val">${fmt(X.owed)}</div><div class="hint">${fmt(X.repaid)} already paid back</div></div>
  <div class="card stat okc"><div class="lbl">Tasks complete</div><div class="val">${X.done} / ${X.tasks.length}</div><div class="bar" style="margin-top:6px"><i class="ok" style="width:${pct(X.done,X.tasks.length)}%"></i></div></div>
  <div class="card stat pendc"><div class="lbl">Payments still pending</div><div class="val">${fmt(X.tPend+X.vBal)}</div><div class="hint">Checklist ${fmt(X.tPend)} · Vendors ${fmt(X.vBal)}</div></div>
 </div>`;
 const{cats,uncat}=catRows();
 let ch=cats.filter(c=>c.spent||num(c.budget)).map(c=>{const b=num(c.budget),over=b&&c.spent>b;
  return `<tr><td>${esc(c.name)}</td><td style="width:35%"><div class="bar"><i class="${over?'over':''}" style="width:${b?pct(c.spent,b):(c.spent?100:0)}%"></i></div></td><td class="num">${fmt(c.spent)}</td><td class="num muted">${b?fmt(b):'—'}</td><td class="num ${over?'overdue':''}">${b?fmt(b-c.spent):''}</td></tr>`}).join('');
 if(uncat)ch+=`<tr><td class="muted">Uncategorized</td><td></td><td class="num">${fmt(uncat)}</td><td></td><td></td></tr>`;
 const ph=peopleRows().map(([p,v])=>{const o=v.t-v.r;
  return `<tr class="${o>0.004?'pend':'ok'}"><td>${esc(p)}</td><td class="num">${v.n}</td><td class="num">${fmt(v.t)}</td><td class="num">${fmt(v.r)}</td><td class="num"><b>${fmt(o)}</b></td><td>${o>0.004?'<span class="pill pend">Owed</span>':'<span class="pill ok">Settled</span>'}</td></tr>`}).join('');
 h+=`<div class="grid two">
  <div class="card"><h2>Budget by category</h2>${ch?`<div class="tw"><table><thead><tr><th>Category</th><th>Used</th><th class="num">Spent</th><th class="num">Budget</th><th class="num">Left</th></tr></thead><tbody>${ch}</tbody></table></div>`:'<div class="empty">No expenses or category budgets yet.</div>'}</div>
  <div class="card"><h2>Reimbursements by person</h2>${ph?`<div class="tw"><table><thead><tr><th>Bought by</th><th class="num">#</th><th class="num">Spent</th><th class="num">Paid back</th><th class="num">Still owed</th><th></th></tr></thead><tbody>${ph}</tbody></table></div>`:'<div class="empty">Log expenses to see who is owed what.</div>'}</div>
 </div>`;
 const eh=S.events.map(e=>{const n=e.tasks.length,dn=e.tasks.filter(t=>t.status==='Complete').length,es=sum(S.expenses.filter(x=>x.eventId===e.id),'cost'),pp=sum(e.tasks.filter(t=>t.payStatus==='Pending'),'amount'),d=daysUntil(e.date);
  return `<tr class="${n&&dn===n?'ok':n?'pend':''}"><td><a href="#" data-act="gotoEvent" data-id="${e.id}"><b>${esc(e.name)}</b></a></td><td>${fmtDate(e.date)}${d!==null&&d>=0?` <span class="muted small">(${d}d)</span>`:''}</td><td class="small">${esc(e.venue||'')}</td><td style="width:22%"><div class="bar"><i class="${n&&dn===n?'ok':''}" style="width:${pct(dn,n)}%"></i></div></td><td class="num">${dn}/${n}</td><td class="num">${fmt(es)}</td><td class="num">${pp?`<span class="pill pend">${fmt(pp)}</span>`:'<span class="muted">—</span>'}</td></tr>`}).join('');
 h+=`<div class="card"><h2>Events at a glance</h2><div class="tw"><table><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>Progress</th><th class="num">Tasks</th><th class="num">Expenses</th><th class="num">Pending pay</th></tr></thead><tbody>${eh}</tbody></table></div></div>`;
 const up=[];
 X.tasks.filter(t=>t.status!=='Complete'&&t.due).forEach(t=>{const d=daysUntil(t.due);if(d<=14)up.push({d,date:t.due,txt:`<b>${esc(t.title||'Untitled task')}</b> <span class="muted">· ${esc(t.evName)}${t.assignee?' · '+esc(t.assignee):''}</span>`})});
 X.tasks.filter(t=>t.payStatus==='Pending'&&t.due&&t.status==='Complete').forEach(t=>{const d=daysUntil(t.due);if(d<=14)up.push({d,date:t.due,txt:`💳 Payment ${fmt(num(t.amount))} for <b>${esc(t.title)}</b> <span class="muted">· ${esc(t.evName)}</span>`})});
 S.vendors.filter(v=>v.status!=='Paid'&&v.due).forEach(v=>{const d=daysUntil(v.due);if(d<=30)up.push({d,date:v.due,txt:`💳 Vendor balance <b>${esc(v.name||'Vendor')}</b> ${fmt(Math.max(0,num(v.total)-num(v.deposit)))} <span class="muted">· ${esc(v.service||'')}</span>`})});
 up.sort((a,b)=>a.d-b.d);
 h+=`<div class="card"><h2>Coming up &amp; overdue</h2>${up.length?`<ul class="list-up">${up.map(u=>`<li><span class="pill ${u.d<0?'bad':u.d<=3?'pend':'na'}">${u.d<0?Math.abs(u.d)+'d overdue':u.d===0?'Today':'in '+u.d+'d'}</span><span class="small muted" style="width:95px">${fmtDate(u.date)}</span><span>${u.txt}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing due in the next two weeks. Add due dates to checklist tasks and vendor balances to see reminders here.</div>'}</div>`;
 return h;
}

/* ---------- Expenses ---------- */
function rcData(e){const r=RC[e.id];return e.receipt&&r&&r.rv===e.receipt.rv?r.data:null}
function catOpts(){const o=S.categories.map(c=>c.name);if(draft.category&&!o.includes(draft.category))o.push(draft.category);return o}
function evOpts(){return [['','General / not event-specific'],...S.events.map(e=>[e.id,e.name])]}
function dsel(f,opts){return `<select data-d="${f}">${opts.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x||'—'];return `<option value="${esc(v)}" ${String(v)===String(draft[f]??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select>`}
function dinp(f,type='text',extra=''){return `<input type="${type}" data-d="${f}" value="${esc(draft[f]??'')}" ${type==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${extra}>`}
function filteredExpenses(){const q=F.q.toLowerCase();
 return S.expenses.filter(e=>(!F.cat||e.category===F.cat)&&(!F.ev||(F.ev==='_none'?!e.eventId:e.eventId===F.ev))&&(!F.who||e.boughtBy===F.who)&&(!F.st||e.status===F.st)&&(!q||[e.receiptName,e.desc,e.category,e.boughtBy,e.method].join(' ').toLowerCase().includes(q)))
  .sort((a,b)=>(b.dateBought||'').localeCompare(a.dateBought||''))}
function rExp(){
 const r=draft.receipt;
 let h=`<div class="card noprint"><h2>${editingExp?'Edit expense':'Add an expense'}</h2><div class="exform">

   ${r?(r.type.startsWith('image/')&&draftData?`<img src="${draftData}" alt="">`:'<span class="big">📄</span>')+`<div style="text-align:left"><b>${esc(r.name)}</b><br><span class="small">${Math.round((r.size||0)/1024)} KB · click to replace</span><br><button class="btn sm danger" data-act="rmDraftReceipt" style="margin-top:6px">Remove</button></div>`
    :`<div><div class="big">🧾</div><b>Drag &amp; drop receipt here</b><br><span class="small">or click to choose · photo or PDF</span></div>`}
  </div>
  <div class="formgrid">
   <label class="f">Receipt name ${dinp('receiptName','text','placeholder="e.g. Sweets order"')}</label>

   <label class="f">Event ${dsel('eventId',evOpts())}</label>
   <label class="f" style="grid-column:span 2">Brief description ${dinp('desc','text','placeholder="What was bought?"')}</label>
   <label class="f">Cost ${dinp('cost','number','placeholder="0.00"')}</label>
   <label class="f">Bought by ${dinp('boughtBy','text','list="peopleList" placeholder="Name"')}</label>
   <label class="f">Date bought ${dinp('dateBought','date')}</label>
   <label class="f">Paid back to buyer? ${dsel('status',['Pending','Paid'])}</label>
   <label class="f">Paid via ${dsel('method',METHODS)}</label>
   <label class="f">Date paid to buyer ${dinp('datePaid','date')}</label>
   <div style="display:flex;gap:8px;align-items:end"><button class="btn pri" data-act="exSave">${editingExp?'Update expense':'＋ Add expense'}</button><button class="btn" data-act="exClear">${editingExp?'Cancel':'Clear'}</button></div>
  </div></div></div>`;
 const rows=filteredExpenses();
 const who=[...new Set(S.expenses.map(e=>e.boughtBy).filter(Boolean))].sort();
 const fsel=(k,opts,ph)=>`<select data-flt="${k}" data-key="flt|${k}"><option value="">${ph}</option>${opts.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 h+=`<div class="card"><div class="toolbar noprint">
   <input data-flt="q" data-key="flt|q" placeholder="🔍 Search…" value="${esc(F.q)}" style="width:180px">
   ${fsel('cat',S.categories.map(c=>c.name),'All categories')}
   ${fsel('ev',[['_none','General'],...S.events.map(e=>[e.id,e.name])],'All events')}
   ${fsel('who',who,'Everyone')}
   ${fsel('st',[['Pending','Pending'],['Paid','Paid']],'Any status')}
   <span class="spacer"></span>
   <span class="legend"><span class="pill ok">Paid</span><span class="pill pend">Pending</span></span>
   <button class="btn sm" data-act="pdf" data-preset="expenses">📄 PDF</button>
   <button class="btn sm" data-act="csv">⬇ CSV</button></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Receipt</th><th>Name / description</th><th>Category · Event</th><th>Bought by</th><th>Date bought</th><th class="num">Cost</th><th>Paid via</th><th>Status</th><th>Date paid to buyer</th><th></th></tr></thead><tbody>
  ${rows.map(e=>`<tr class="${e.status==='Paid'?'ok':'pend'}">
   <td>${rcell(e)}</td>
   <td><b>${esc(e.receiptName||'—')}</b><div class="small muted">${esc(e.desc)}</div></td>

   <td style="min-width:105px">${fld({col:'expenses',id:e.id,f:'status',val:e.status,opts:['Pending','Paid'],cls:stCls(e.status)})}</td>
   <td style="min-width:140px">${fld({col:'expenses',id:e.id,f:'datePaid',val:e.datePaid,type:'date'})}</td>

  </tbody><tfoot><tr><td colspan="5">${rows.length} expense${rows.length===1?'':'s'} shown</td><td class="num">${fmt(sum(rows,'cost'))}</td><td colspan="4" class="small"><span class="pill ok">Paid ${fmt(sum(rows.filter(e=>e.status==='Paid'),'cost'))}</span> <span class="pill pend">Pending ${fmt(sum(rows.filter(e=>e.status!=='Paid'),'cost'))}</span></td></tr></tfoot></table></div>`
  :`<div class="empty">${S.expenses.length?'No expenses match these filters.':'No expenses yet — drag a receipt into the box above to start.'}</div>`}
  <div class="small muted noprint" style="margin-top:8px">Tip: drop a receipt onto the ＋ square in any row to attach it to that expense.</div></div>`;
 return h;
}
function rcell(e){const r=e.receipt;
 if(r){const d=rcData(e);
  if(!d)return `<div class="mini-drop file" data-act="view" data-id="${e.id}" data-drop="${e.id}" title="Receipt not downloaded yet — click to fetch">⏳</div>`;
  return r.type.startsWith('image/')?`<img class="thumb" src="${d}" data-act="view" data-id="${e.id}" data-drop="${e.id}" title="${esc(r.name)} — click to view">`:`<div class="mini-drop file" data-act="view" data-id="${e.id}" data-drop="${e.id}" title="${esc(r.name)} — click to view">📄</div>`}
 return `<div class="mini-drop" data-drop="${e.id}" data-act="pick" data-id="${e.id}" title="Drop or click to attach receipt">＋</div>`}

  <select data-flt="ta" data-key="flt|ta"><option value="">Anyone</option>${assignees.map(a=>`<option ${F.ta===a?'selected':''}>${esc(a)}</option>`).join('')}</select>

 S.events.forEach((ev,i)=>{

   <div class="prog"><div class="bar" style="flex:1"><i class="${n&&dn===n?'ok':''}" style="width:${pct(dn,n)}%"></i></div>${dn}/${n} done</div>
   ${pPaid?`<span class="pill ok">Paid ${fmt(pPaid)}</span>`:''}${pPend?`<span class="pill pend">Pending ${fmt(pPend)}</span>`:''}
   <span class="spacer"></span>
   <span class="noprint" style="white-space:nowrap">
    <button class="btn sm" data-act="suggest" data-id="${ev.id}" title="Add common tasks for this event">✨ Suggested</button>
    <button class="btn sm" data-act="evPdf" data-id="${ev.id}" title="PDF of this event's checklist">📄 PDF</button>
    <button class="btn sm ghost" data-act="evUp" data-id="${ev.id}" ${i===0?'disabled':''} title="Move up">↑</button>
    <button class="btn sm ghost" data-act="evDown" data-id="${ev.id}" ${i===S.events.length-1?'disabled':''} title="Move down">↓</button>
    <button class="btn sm ghost danger" data-act="evDel" data-id="${ev.id}" title="Delete event">🗑</button></span>
  </div>`;
  if(!collapsed){
   h+=shown.length?`<div class="tw" style="margin-top:10px"><table><thead><tr><th style="width:34px"></th><th>Task</th><th>Assigned to</th><th>Due</th><th>Status</th><th class="num">Payment</th><th>Payment status</th><th>Notes</th><th></th></tr></thead><tbody>

    <td class="tdone" style="min-width:200px">${fld({col:'tasks',ev:ev.id,id:t.id,f:'title',val:t.title,cls:'ttl',ph:'Task'})}</td>
    <td style="min-width:130px">${fld({col:'tasks',ev:ev.id,id:t.id,f:'assignee',val:t.assignee,list:'peopleList',ph:'Who?'})}</td>
    <td style="min-width:135px">${fld({col:'tasks',ev:ev.id,id:t.id,f:'due',val:t.due,type:'date',cls:od?'overdue':''})}</td>
    <td style="min-width:115px">${fld({col:'tasks',ev:ev.id,id:t.id,f:'status',val:t.status,opts:['Pending','Complete'],cls:stCls(t.status)})}</td>

   </tbody></table></div>`:`<div class="empty small">${n?'No tasks match the current filter.':'No tasks yet — add one below or click ✨ Suggested.'}</div>`;
   h+=`<div class="toolbar noprint" style="margin:10px 0 0"><input data-newtask="${ev.id}" placeholder="Add a task to ${esc(ev.name)} and press Enter" style="flex:1;min-width:220px"><input data-newassign="${ev.id}" list="peopleList" placeholder="Assign to" style="width:150px"><button class="btn" data-act="addTask" data-id="${ev.id}">＋ Add task</button></div>`;

/* ---------- Vendors ---------- */
const vBalance=v=>v.status==='Paid'?0:Math.max(0,num(v.total)-num(v.deposit));
function rVend(){

 const rep=$('#report');rep.innerHTML=parts.map((p,i)=>`<section class="sec ${i?'':'first'}">${repHead(label)}${p}</section>`).join('');
 await Promise.all([...rep.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):null));
 const oldTitle=document.title;document.title=`${(S.settings.names||'Wedding').replace(/[\\/:*?"<>|&]/g,' ').replace(/\s+/g,' ').trim()} - ${label} - ${todayISO()}`;

function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function compressImage(file){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82)}finally{URL.revokeObjectURL(url)}}
async function readReceipt(file){
 const isImg=file.type.startsWith('image/'),isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
 if(!isImg&&!isPdf){alert('Please use a photo (JPG/PNG) or a PDF receipt.');return null}
 let data,type=isPdf?'application/pdf':file.type;
 if(isImg&&file.size>250*1024&&file.type!=='image/gif'){try{data=await compressImage(file);type='image/jpeg'}catch(e){data=null}}
 if(!data){if(file.size>12*1024*1024&&!confirm('This file is large ('+Math.round(file.size/1048576)+' MB) and may slow things down. Attach anyway?'))return null;data=await readAsDataURL(file)}
 return{meta:{name:file.name,type,size:Math.round(data.length*0.75),rv:uid()},data}}
async function attach(target,file){
 const r=await readReceipt(file);if(!r)return;
 if(target==='draft'){draft.receipt=r.meta;draftData=r.data;if(!draft.receiptName)draft.receiptName=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')}
 else{const x=S.expenses.find(e=>e.id===target);if(x){x.receipt=r.meta;RC[x.id]={rv:r.meta.rv,data:r.data};await saveRC(x.id);if(!x.receiptName)x.receiptName=file.name.replace(/\.[^.]+$/,'');touch(x);save()}}
 render()}

 switch(a){

 case 'closeModal':$('#modal').classList.remove('show');$('#mBody').innerHTML='';break;
 case 'gotoEvent':{tab='checklist';COL.delete(id);LS.set('collapsed',[...COL]);render();const n=document.getElementById('ev-'+id);n&&n.scrollIntoView({behavior:'smooth',block:'start'});break}

  if(!(num(draft.cost)>0)&&!confirm('No cost entered. Save anyway?'))return;
  const rec={...draft,cost:num(draft.cost)};addPerson(rec.boughtBy);
  if(rec.category&&!S.categories.some(c=>c.name===rec.category)){const c={id:'cat-'+slug(rec.category),name:rec.category,budget:0,c:Date.now()};touch(c);S.categories.push(c)}
  let x;

  else{x={id:uid(),c:Date.now(),...rec};S.expenses.push(x)}
  if(x){touch(x);if(x.receipt&&draftData&&(!RC[x.id]||RC[x.id].rv!==x.receipt.rv)){RC[x.id]={rv:x.receipt.rv,data:draftData};saveRC(x.id)}
   if(!x.receipt&&RC[x.id]){delete RC[x.id];saveRC(x.id)}}
  editingExp=null;draft=newDraft(rec);draftData=null;save();render();break}

 case 'csv':exportCSV();break;
 // checklist
 case 'addEvent':{const i=$('#newEvent'),n=(i&&i.value||'').trim();if(!n){i&&i.focus();return}
  const ev={id:uid(),name:n,date:'',venue:'',ord:Math.max(-1,...S.events.map(e=>e.ord??0))+1,c:Date.now(),tasks:[]};touch(ev);S.events.push(ev);

 case 'rmPerson':S.people=S.people.filter(p=>p.id!==id);tomb(id);save();render();break;
 case 'addCat':{const c={id:uid(),name:'New category',budget:0,c:Date.now()};touch(c);S.categories.push(c);save();render();break}
 case 'catDel':{const c=S.categories.find(x=>x.id===id);const n=S.expenses.filter(e=>e.category===c.name).length;if(confirm(`Delete category "${c.name}"?${n?` ${n} expense(s) will show as uncategorized.`:''}`)){S.categories=S.categories.filter(x=>x.id!==id);tomb(id);save();render()}break}
 case 'backup':{const rc={};S.expenses.forEach(e=>{const d=rcData(e);if(d)rc[e.id]={rv:e.receipt.rv,data:d}});
  download(`wedding-planner-backup-${todayISO()}.json`,JSON.stringify({...S,_receipts:rc}),'application/json');LS.set('lastBackup',Date.now());render();break}
 case 'snooze':LS.set('snooze',Date.now()+864e5);renderBackupBar();break;
 case 'restore':{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.events&&!d.expenses)throw 0;
   if(confirm('Load the data from this backup? It will be merged with what is here (the most recent version of each item is kept).')){
    const rc=d._receipts||{};delete d._receipts;const B=normalize(d);
    for(const k in rc){RC[k]=rc[k];await saveRC(k)}for(const k of migratedRC.splice(0))await saveRC(k);
    S=S.pristine?B:mergeState(S,B);save();render();alert('Backup loaded.')}}catch(e){alert('That file doesn\'t look like a planner backup.')}};i.click();break}
 case 'reset':if(confirm('Erase all planner data on THIS device? (If shared sync is on, this device is also disconnected — the shared copy on GitHub is not touched.)')&&confirm('Are you sure? Download a backup first if you might need it.')){
  resetDevice();render()}break;
 // passcode
 case 'pcSet':setPasscode();break;
 case 'pcRemove':removePasscode();break;
 case 'lockNow':if(!LS.get('pclock',null))return;PC.code=null;storeCode(null);showLock('local','The planner is locked. Enter the family passcode to continue.');break;
 // sync
 case 'ghConnect':readGhForm();if(!ghReady()){alert('Fill in the owner, repository and access token.');return}repoOk=false;lastErr='';setSync('⟳ Connecting…');sync().then(()=>render());break;
 case 'syncNow':if(tab==='settings'&&$('#gh_owner'))readGhForm();if(ghReady()){repoOk=false;sync().then(()=>{if(tab==='settings')render()})}else{tab='settings';render();$('#syncCard')&&$('#syncCard').scrollIntoView({behavior:'smooth'})}break;
 case 'ghDisconnect':if(confirm('Disconnect this device from shared sync? Your data stays on this device; the token is removed.')){GH.token='';LS.set('gh',GH);lastErr='';setSync('');render()}break;
 case 'ghLink':{readGhForm();if(!GH.owner||!GH.repo){alert('Fill in the owner and repository first.');return}
  const cfg={owner:GH.owner,repo:GH.repo,branch:GH.branch,path:GH.path,rdir:GH.rdir};const url=location.href.split('#')[0]+'#sync='+encodeURIComponent(JSON.stringify(cfg));
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>alert('Setup link copied. Send it to family — they open it, paste their access token, and click Connect.\n\nThe link does NOT include your token.'),()=>prompt('Copy this setup link:',url));break}
 case 'ghInvite':{readGhForm();
  if(!ghReady()||lastErr){alert('Connect Shared sync successfully first.');return}
  if(!PC.code||!LS.get('pclock',null)){alert('Set a family passcode first — the invite link is locked with it.');return}
  (async()=>{const salt=newSalt(),k=await deriveKey(PC.code,salt);
   const tok=b64encBytes(await encBytes(k,new TextEncoder().encode(GH.token)));
   const cfg={owner:GH.owner,repo:GH.repo,branch:GH.branch,path:GH.path,rdir:GH.rdir,salt,tok};
   const url=location.href.split('#')[0]+'#join='+encodeURIComponent(JSON.stringify(cfg));
   const msg='Family invite link copied!\n\nSend it to family, and send the passcode separately (text or in person). They open the link, type the passcode, and they\'re in — no GitHub account or token needed.\n\nThe link is useless without the passcode. If you change the passcode, make a new invite link.';
   (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>alert(msg),()=>prompt('Copy this invite link:',url))})();break}
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
 if(el.tagName==='A')e.preventDefault();
 if(el.dataset.act==='pick'&&e.target.closest('[data-act="rmDraftReceipt"]'))return;
 e.stopPropagation();act(el.dataset.act,el)});

/* drag & drop */
document.addEventListener('dragover',e=>{e.preventDefault();const z=e.target.closest('[data-drop]');
 document.querySelectorAll('.over').forEach(x=>{if(x!==z)x.classList.remove('over')});
 if(z){z.classList.add('over');e.dataTransfer.dropEffect='copy'}else e.dataTransfer.dropEffect=tab==='expenses'?'copy':'none'});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
 const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;const z=e.target.closest('[data-drop]');
 if(z)attach(z.dataset.drop,f);else if(tab==='expenses')attach('draft',f)});

/* ================= init ================= */
(async()=>{
 if(!LS.get('firstUse',0))LS.set('firstUse',Date.now());
 S=normalize(await load());
 for(const k of migratedRC.splice(0))await saveRC(k);
 if(location.hash.startsWith('#sync=')){try{const cfg=JSON.parse(decodeURIComponent(location.hash.slice(6)));['owner','repo','branch','path','rdir'].forEach(k=>{if(cfg[k])GH[k]=String(cfg[k])});LS.set('gh',GH);tab='settings'}catch(e){}
  history.replaceState(null,'',location.pathname+location.search)}
 loadCode();
 if(location.hash.startsWith('#join=')){try{pendingJoin=JSON.parse(decodeURIComponent(location.hash.slice(6)))}catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
  if(pendingJoin&&pendingJoin.tok){if(!hasCrypto()){alert('Please open this invite link in Chrome, Edge or Safari.');}else{tab='dashboard';showLock('join','You\'ve been invited to the family wedding planner. Enter the family passcode to join.');$('#lockRem').checked=true;return}}}
 if(LS.get('pclock',null)&&!(PC.code&&await verifyLocal(PC.code))){PC.code=null;showLock('local');return}
 start();
})();
async function start(){
 started=true;render();
 if(tab==='settings'&&!ghReady())setTimeout(()=>{const t=$('#gh_token');if(t){$('#syncCard').scrollIntoView({behavior:'smooth'});t.focus()}},100);
 setSaveInd(storageMode==='memory'?'⚠ Not saved in this browser — use Backup':'✓ Saved on this device');
 await requestPersist();
 if(ghReady()){setSync('⟳ Syncing…');sync()}
}
</script>
</body>
